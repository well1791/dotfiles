[metadata]
name = "sesh"
description = "Session manager integrating rmux sessions, zoxide directories, and config paths"
requirements = ["sesh", "rmux"]

[source]
command = [
  "sesh list --icons",
  "sesh list -t --icons",
  "sesh list -c --icons",
  "sesh list -z --icons",
  "fd -H -d 2 -t d -E .Trash . ~",
]
ansi = true
output = "{strip_ansi|split: :1..|join: }"

[preview]
command = "sesh preview '{strip_ansi|split: :1..|join: }'"

[keybindings]
enter = "actions:connect"
ctrl-d = ["actions:kill_session", "reload_source"]

[actions.connect]
description = "Connect to selected session (creates if needed, then attaches)"
command = "sesh-connect '{strip_ansi|split: :1..|join: }'"
mode = "execute"

[actions.kill_session]
description = "Kill selected rmux session"
command = "rmux kill-session -t '{strip_ansi|split: :1..|join: }'"
mode = "fork"
